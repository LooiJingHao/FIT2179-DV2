<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malaysia Durian Production Map</title>

  <style>
    #map {
      display: flex;
      justify-content: center;
      align-items: center;
      clip-path: inset(13px 0px 10px 10px);
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/vega@5.22.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.2.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.20.8"></script>
</head>

<body>
  <div id="map"></div>

  <script>
    const vg_1 = {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "width": 825,
      "height": 395,

      "projection": {
        "type": "mercator",
        "center": [109.2, 4.2],
        "scale": 2300
      },

      "config": {
        "background": "#dceefb",
        "view": {
          "stroke": "transparent"
        }
      },

      "layer": [
        {
          "data": {
            "url": "./DV2/data/ne_10m_admin_0_countries.topojson",
            "format": {
              "type": "topojson",
              "feature": "ne_10m_admin_0_countries"
            }
          },
          "mark": {
            "type": "geoshape",
            "fill": "#FFFFFF",
            "stroke": "#999",
            "strokeWidth": 0.7
          }
        },

        {
          "data": {
            "url": "./DV2/data/production_by_states.csv"
          },

          "transform": [
            {
              "filter": "datum.crop_species == 'durian'"
            },
            {
              "aggregate": [
                {
                  "op": "sum",
                  "field": "production",
                  "as": "total_production"
                }
              ],
              "groupby": ["state"]
            },
            {
              "lookup": "state",
              "from": {
                "data": {
                  "url": "./DV2/data/malaysia_states.topojson",
                  "format": {
                    "type": "topojson",
                    "feature": "geoBoundaries-MYS-ADM1_simplified"
                  }
                },
                "key": "properties.shapeName",
                "fields": ["type", "geometry", "properties"]
              }
            }
          ],

          "mark": {
            "type": "geoshape",
            "stroke": "white",
            "strokeWidth": 1.2
          },

          "encoding": {
            "tooltip": [
              {
                "field": "state",
                "type": "nominal",
                "title": "State"
              },
              {
                "field": "total_production",
                "type": "quantitative",
                "title": "Total Production",
                "format": ",.0f"
              }
            ]
          }
        }
      ]
    };

    vegaEmbed("#map", vg_1).catch(console.error);
  </script>
</body>
</html>
